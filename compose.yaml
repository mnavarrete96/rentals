services:
  db:
    image: postgres:16-alpine
    container_name: arrendatarios_db
    environment:
      POSTGRES_DB: ${DB_NAME:-arrendatarios_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
