# Propiedades para tests.
# Provee valores dummy para las variables de entorno que application.yml necesita,
# para que los placeholders ${DB_URL} etc. resuelvan sin fallar.
# @DynamicPropertySource en cada test sobreescribe spring.datasource.* con la URL del container.
DB_URL=jdbc:postgresql://localhost:5432/test
DB_USERNAME=test
DB_PASSWORD=test

# JWT secret for tests: 48 random bytes Base64-encoded (NOT a real secret)
RENTALS_JWT_SECRET=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seS1ub3QtYS1yZWFsLXNlY3JldC0xMjM0NQ==

# En los slice tests (@DataJpaTest) deshabilitamos Flyway y dejamos que Hibernate
# genere el esquema directamente desde las entidades (create-drop).
# Los tests de integracion completos usaran @SpringBootTest con Flyway habilitado.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
